# mypy.ini — type-check configuration.
#
# Not pyproject.toml: osv-scanner treats that as a dependency manifest, and
# .claude/hooks/secret-scan.sh special-cases this repo's "No package sources
# found" result as OK. A pyproject.toml would change that Stop hook's behavior
# as a side effect of a typing decision. Same reasoning as ruff.toml.
#
# python_version is deliberately unset so mypy assumes the running interpreter
# rather than pinning semantics a contributor on another version would not have.
#
# Deliberately not --strict: 103 of 233 functions carry no annotations, so
# disallow_untyped_defs would turn a 16-error baseline into hundreds and the
# gate would have to be born suppressed.

[mypy]
# Check whole-tree, not per-file: invoking mypy on one file re-reports errors
# that live in the modules it imports, which triple-counts the real total.
warn_unused_ignores = True

# lxml ships no type stubs. The import is already guarded by try/ImportError at
# the call site, so this silences a missing-stub report, not a real defect.
[mypy-lxml.*]
ignore_missing_imports = True
