name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  install-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12: the oldest python3 the shipped hooks and skills meet on user
        # machines (ubuntu-24.04's system Python). 3.14: .python-version, what
        # the dev hosts and their .venv run. Code that only works on one of
        # them fails here instead of on a user's machine.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      # Pinned per matrix entry, not the runner image's python3: py-check.sh's
      # indented `python3 -c` body passed on 3.14 (which dedents -c code) and
      # broke on the image's 3.12.
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # No requirements.txt exists (a dev host has these globally, masking the
      # gap) — pytest runs the *.py tests, lxml is needed by confluence-tree's
      # tree_fetch.py/xhtml_to_md.py. Found by actually running this workflow
      # on a clean runner and reading the real "No module named X" failures,
      # not guessed in advance.
      - name: Install Python test dependencies
        run: pip install pytest lxml

      # Most local-skill tests source ~/.agent-skills-setup/lib.sh and silently
      # skip (exit 0) if it's absent — a real install is required first, or the
      # test run gives false confidence. plugin registry entries are skipped
      # automatically (claude CLI isn't present on this runner).
      # --allow-non-main: a PR checkout is a detached merge ref, and a throwaway
      # runner has no other agents for a non-main install to mislead.
      - name: Install (claude agent)
        run: bash scripts/install.sh --agent claude --allow-non-main

      - name: Run tests
        run: bash scripts/run-tests.sh --fast
