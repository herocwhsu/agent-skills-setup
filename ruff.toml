# Formatter config only. `ruff check` is deliberately not wired into any hook:
# the tree carries 74 findings under ruff's default rules, so gating an edit on
# them would block over pre-existing issues rather than the change at hand.
#
# ruff.toml rather than pyproject.toml: osv-scanner treats pyproject.toml as a
# dependency manifest, and .claude/hooks/secret-scan.sh special-cases this
# repo's "No package sources found" result as OK. A pyproject.toml would change
# that Stop hook's behavior as a side effect of a formatting decision.
#
# 100 over ruff's default 88: the tree already runs past 88 in 99 places, so 88
# forces the most rewrapping of code that was written deliberately.
line-length = 100
